name: ci

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 can't install browsers on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python -m py_compile lambda/*.py
      - run: python -m pytest tests/unit/python -q
      # Local stack, no AWS: mirrors scripts/dev_local.sh. The image tag must match scripts/dev_local.sh.
      - name: Start Floci, local API and seed
        run: |
          docker run -d --name panindo-floci -p 127.0.0.1:4566:4566 floci/floci:2.3.0
          for _ in $(seq 50); do curl -sf http://localhost:4566/_floci/health >/dev/null && break; sleep 0.2; done
          curl -sf http://localhost:4566/_floci/health >/dev/null || { docker logs panindo-floci; exit 1; }
          python scripts/local_api.py > "$RUNNER_TEMP/local_api.log" 2>&1 &
          python scripts/local_seed.py
      # The seed writes a fresh local-only login on every run; it is not a secret.
      - name: Seeded login for e2e
        run: |
          password=$(jq -r .password .local/test-login.json)
          echo "::add-mask::$password"
          echo "EVAL_EMAIL=$(jq -r .owner .local/test-login.json)" >> "$GITHUB_ENV"
          echo "EVAL_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_API_BASE: http://localhost:3001
      - if: failure()
        run: cat "$RUNNER_TEMP/local_api.log"
