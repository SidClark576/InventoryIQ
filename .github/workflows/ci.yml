name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        if: ${{ secrets.EVAL_EMAIL != '' }}
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://theinventoryiq.netlify.app' }}
          EVAL_EMAIL: ${{ secrets.EVAL_EMAIL }}
          EVAL_PASSWORD: ${{ secrets.EVAL_PASSWORD }}
        run: npx playwright test
      - name: Skip notice
        if: ${{ secrets.EVAL_EMAIL == '' }}
        run: echo "No EVAL_EMAIL secret — skipping live E2E."

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Lambdas
        run: python3 -m py_compile lambda/*.py
