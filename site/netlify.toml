# Panindo marketing site (panindo.app). Deploys as its own Netlify site with
# Base directory = site. Paths below are relative to that base directory.
# Plain static files: no build command, no functions.
[build]
  publish = "."
  command = ""

# Folder-per-page (privacy/index.html) gives clean URLs like /privacy/ without
# Netlify's deprecated Pretty URLs post-processing. These cover common guesses.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/tos"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/delete"
  to = "/delete-account/"
  status = 301

[[redirects]]
  from = "/help"
  to = "/support/"
  status = 301

# The site ships no JavaScript and makes no third-party requests (fonts are
# self-hosted in /fonts/). img-src allows data: for the CSS grain texture.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
