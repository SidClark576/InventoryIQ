# The app moved to Cloudflare Pages (app.panindo.app). This Netlify site (theinventoryiq.netlify.app) only
# redirects: every path goes to the same path on the new address. Netlify forwards the query string, so
# old invite and reset links (/accept.html?token=...) keep their token. No build.
[build]
  publish = "netlify-redirect"  # not frontend/public: its _redirects (Pages rewrites) would shadow the 301
  command = ""

[[redirects]]
  from = "/*"
  to = "https://app.panindo.app/:splat"
  status = 301
  force = true
