# Static site — no build step. Backend stays on AWS API Gateway (see frontend/config.js).
[build]
  publish = "frontend"

# Security headers (frontend is static; CSP kept loose because pages use inline scripts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
