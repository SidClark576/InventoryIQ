<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InventoryIQ | Forecast</title>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#005ab4' } } }
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="antialiased text-[#eef2fb]">
  <div class="h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-[#11182b] border-r border-[#243352] flex flex-col justify-between shrink-0">
      <div>
        <div class="h-20 flex items-center px-6 border-b border-[#243352]">
          <div class="flex items-center gap-3.5">
            <div
              class="w-10 h-10 bg-[#0a0e1a] rounded-xl border border-[#243352] flex items-center justify-center p-1.5 shadow-[0_0_20px_-6px_rgba(226,182,92,0.4)]">
              <svg viewBox="0 0 100 100" class="w-full h-full">
                <polygon points="50,15 85,35 50,55 15,35" fill="#fbbd5c" />
                <polygon points="15,35 50,55 50,90 15,70" fill="#f26d5b" />
                <polygon points="85,35 50,55 50,90 85,70" fill="#9c3f91" />
              </svg>
            </div>
            <div class="flex flex-col">
              <span class="text-[16px] font-black text-[#eef2fb] leading-tight tracking-tight">InventoryIQ</span>
              <span class="text-[10px] font-bold text-[#5d6f96] tracking-[0.12em] uppercase">Ops Terminal</span>
            </div>
          </div>
        </div>

        <nav class="p-3 space-y-1 mt-3">
          <a href="dashboard.html" data-page="dashboard"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">grid_view</span> Dashboard
          </a>
          <a href="inventory.html" data-page="inventory"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">inventory_2</span> Inventory
          </a>
          <a href="suppliers.html" data-page="suppliers"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">local_shipping</span> Suppliers
          </a>

          <a href="insights.html" data-page="insights"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">bar_chart</span> Insights
          </a>
          <a href="transactions.html" data-page="transactions"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">receipt_long</span> Transactions
          </a>
          <a href="forecast.html" data-page="forecast"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">trending_up</span> Forecast
          </a>
        </nav>
      </div>

      <div class="p-3 border-t border-[#243352] pt-4">
        <button
          class="btn-press flex items-center gap-3 w-full px-4 py-3 text-[#f87171] hover:bg-[#f87171]/10 rounded-xl font-semibold text-sm cursor-pointer"
          onclick="handleLogout()">
          <span class="material-symbols-outlined text-xl">logout</span> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
      <header
        class="h-20 bg-[#11182b]/80 backdrop-blur border-b border-[#243352] flex items-center justify-end px-10 shrink-0">
        <span class="text-sm font-semibold text-[#9fb0d0]" id="nav-email"></span>
      </header>

      <main class="flex-1 overflow-auto p-10 space-y-8">

        <div class="flex items-end justify-between flex-wrap gap-4">
          <div>
            <h1 class="text-3xl font-black text-[#eef2fb] tracking-tight">Demand Forecast</h1>
            <p class="text-[#9fb0d0] mt-2 text-sm">Weighted moving average of stock-out transactions over 90 days.</p>
            <div class="title-rule"></div>
          </div>
          <button
            class="btn-press bg-[#161f36] border border-[#243352] px-5 py-2.5 rounded-xl font-bold text-[13px] text-[#9fb0d0] hover:text-[#eef2fb] hover:border-[#33476f] transition flex items-center gap-2 cursor-pointer"
            onclick="loadForecast()">
            <span class="material-symbols-outlined font-bold text-[18px]">refresh</span> Refresh
          </button>
        </div>

        <!-- Legend -->
        <div class="flex items-center gap-6 text-[12px] font-semibold text-[#9fb0d0]">
          <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#f87171] inline-block"></span>
            &lt;7 days (critical)</span>
          <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#fbbf24] inline-block"></span>
            7–30 days (watch)</span>
          <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#34d399] inline-block"></span>
            &gt;30 days (healthy)</span>
        </div>

        <!-- Forecast cards -->
        <div id="forecast-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>

      </main>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="charts.js"></script>
  <script>
    requireAuth();
    initNav('forecast');

    let forecastItems = [];

    function skeletonGrid() {
      return Array.from({ length: 6 }).map(() => `
        <div class="surface-card p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div class="skeleton h-4 w-32"></div>
            <div class="skeleton h-6 w-16 rounded-full"></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="skeleton h-14"></div><div class="skeleton h-14"></div>
            <div class="skeleton h-14"></div><div class="skeleton h-14"></div>
          </div>
          <div class="skeleton h-9 w-full rounded-xl"></div>
        </div>`).join('');
    }

    async function loadForecast() {
      const grid = document.getElementById('forecast-grid');
      grid.innerHTML = skeletonGrid();
      try {
        const data = await getForecast();
        forecastItems = data.forecasts || [];
        renderForecast();
      } catch (e) {
        grid.innerHTML = `<div class="surface-card col-span-full text-center py-14 px-6">
          <span class="material-symbols-outlined text-4xl text-[#f87171] block mb-3">cloud_off</span>
          <p class="text-[#eef2fb] font-bold">Couldn't load forecast</p>
          <p class="text-sm text-[#9fb0d0] mt-1">${escHTML(e.message)}</p>
        </div>`;
      }
    }

    function urgencyMeta(days) {
      if (days < 7) return { color: '#f87171', label: 'Critical', pct: 12, dot: 'bg-[#f87171]' };
      if (days < 30) return { color: '#fbbf24', label: 'Watch', pct: 48, dot: 'bg-[#fbbf24]' };
      return { color: '#34d399', label: 'Healthy', pct: 92, dot: 'bg-[#34d399]' };
    }

    function burnSeries(burn) {
      // Derive a small, deterministic burn-rate series for the sparkline so it
      // visualizes the rate without fabricating false data points.
      const b = Math.max(0.01, Number(burn) || 0);
      return [b * 0.7, b * 0.85, b * 1.05, b * 0.95, b * 1.15, b];
    }

    function renderForecast() {
      const grid = document.getElementById('forecast-grid');
      if (!forecastItems.length) {
        grid.innerHTML = `
          <div class="surface-card col-span-full text-center py-16 px-6">
            <div class="w-14 h-14 rounded-full bg-[#1d2942] border border-[#243352] flex items-center justify-center mx-auto mb-4">
              <span class="material-symbols-outlined text-3xl text-[#5d6f96]">trending_flat</span>
            </div>
            <p class="text-lg font-bold text-[#eef2fb]">No forecast data yet</p>
            <p class="text-sm text-[#9fb0d0] mt-2 max-w-md mx-auto">Record at least 3 stock-out transactions per item over 90 days to generate predictions.</p>
          </div>`;
        return;
      }

      grid.innerHTML = forecastItems.map((f, idx) => {
        const u = urgencyMeta(f.daysUntilStockout);
        const confPct = Math.round(f.confidence * 100);
        const daysLabel = f.daysUntilStockout >= 9999 ? '∞' : f.daysUntilStockout.toFixed(1);
        const spark = renderSparkline(burnSeries(f.dailyBurn), { width: 96, height: 30, stroke: u.color, fill: u.color + '22' });
        return `
          <div class="surface-card stat-card p-6 flex flex-col gap-4" style="--card-accent:${u.color}">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full ${u.dot} flex-shrink-0 mt-1 ${f.daysUntilStockout < 7 ? 'dot-pulse' : ''}"></span>
                <h3 class="font-bold text-[#eef2fb] text-[15px] leading-tight truncate">${escHTML(f.name)}</h3>
              </div>
              <span class="text-[11px] font-bold px-2.5 py-1 rounded-full border whitespace-nowrap flex-shrink-0 tnum"
                style="color:${u.color};background:${u.color}1a;border-color:${u.color}40">${daysLabel}d left</span>
            </div>

            <!-- urgency meter -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[10px] font-bold uppercase tracking-[0.12em] text-[#5d6f96]">Days until stockout</span>
                <span class="text-[11px] font-bold" style="color:${u.color}">${u.label}</span>
              </div>
              <div class="h-2 w-full rounded-full bg-[#1d2942] overflow-hidden">
                <div class="h-full rounded-full" style="width:${u.pct}%;background:${u.color}"></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-sm">
              <div class="bg-[#1d2942] border border-[#243352] rounded-xl p-3">
                <div class="text-[10px] text-[#5d6f96] font-bold uppercase tracking-wider mb-1.5">Daily Burn</div>
                <div class="flex items-end justify-between gap-1">
                  <span class="font-bold text-[#eef2fb] tnum text-base">${f.dailyBurn.toFixed(2)}</span>
                  <span class="opacity-90">${spark}</span>
                </div>
                <div class="text-[10px] text-[#5d6f96] mt-0.5">units / day</div>
              </div>
              <div class="bg-[#1d2942] border border-[#243352] rounded-xl p-3">
                <div class="text-[10px] text-[#5d6f96] font-bold uppercase tracking-wider mb-1.5">Suggested</div>
                <div class="font-bold text-[#e2b65c] tnum text-base">${f.suggestedThreshold}</div>
                <div class="text-[10px] text-[#5d6f96] mt-0.5">threshold units</div>
              </div>
              <div class="bg-[#1d2942] border border-[#243352] rounded-xl p-3">
                <div class="text-[10px] text-[#5d6f96] font-bold uppercase tracking-wider mb-1.5">Confidence</div>
                <div class="font-bold text-[#eef2fb] tnum text-base">${confPct}%</div>
                <div class="text-[10px] text-[#5d6f96] mt-0.5">${f.sampleSize} txns</div>
              </div>
              <div class="bg-[#1d2942] border border-[#243352] rounded-xl p-3">
                <div class="text-[10px] text-[#5d6f96] font-bold uppercase tracking-wider mb-1.5">Method</div>
                <div class="font-bold text-[#eef2fb] text-[13px]">${escHTML(f.method)}</div>
                <div class="text-[10px] text-[#5d6f96] mt-0.5">${f.windowDays}d window</div>
              </div>
            </div>

            <button
              id="apply-btn-${idx}"
              onclick="applyThreshold('${escHTML(f.itemID)}', ${f.suggestedThreshold}, ${idx})"
              class="btn-press w-full mt-auto bg-[#1d2942] hover:bg-[#005ab4] hover:text-white border border-[#243352] hover:border-[#005ab4] text-[#9fb0d0] rounded-xl py-2.5 text-[13px] font-bold transition-colors flex items-center justify-center gap-2 cursor-pointer">
              <span class="material-symbols-outlined text-[16px]">tune</span> Apply Threshold
            </button>
            <div id="apply-msg-${idx}" class="text-xs text-center text-[#5d6f96] hidden"></div>
          </div>`;
      }).join('');
    }

    async function applyThreshold(itemID, threshold, idx) {
      const btn = document.getElementById(`apply-btn-${idx}`);
      const msg = document.getElementById(`apply-msg-${idx}`);
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">hourglass_top</span> Saving…';
      msg.classList.add('hidden');
      try {
        const userID = sessionStorage.getItem('userEmail') || '';
        await updateItem(itemID, { lowStockThreshold: threshold, userID });
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">check_circle</span> Applied';
        btn.classList.remove('text-[#9fb0d0]');
        btn.classList.add('text-[#34d399]', 'bg-[#34d399]/10', 'border-[#34d399]/30');
        msg.textContent = `Threshold set to ${threshold} units`;
        msg.classList.remove('hidden', 'text-[#f87171]');
        msg.classList.add('text-[#34d399]');
        if (typeof showToast === 'function') showToast(`Threshold set to ${threshold} units`, 'ok');
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">tune</span> Apply Threshold';
        msg.textContent = e.message;
        msg.classList.remove('hidden', 'text-[#34d399]');
        msg.classList.add('text-[#f87171]');
        if (typeof showToast === 'function') showToast(e.message, 'err');
      }
    }

    loadForecast();
  </script>

</body>

</html>
