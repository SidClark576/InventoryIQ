<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>InventoryIQ | Reset Password</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#f9f9ff", "error": "#ba1a1a", "error-container": "#ffdad6", "inverse-on-surface": "#eff0fa",
            "inverse-primary": "#aac7ff", "inverse-surface": "#2d3038", "on-background": "#181c22", "on-error": "#ffffff",
            "on-error-container": "#93000a", "on-primary": "#ffffff", "on-primary-container": "#fefcff", "on-primary-fixed": "#001b3e",
            "on-primary-fixed-variant": "#00458d", "on-secondary": "#ffffff", "on-secondary-container": "#405882", "on-secondary-fixed": "#001b3e",
            "on-secondary-fixed-variant": "#2e4770", "on-surface": "#181c22", "on-surface-variant": "#414753", "on-tertiary": "#ffffff",
            "on-tertiary-container": "#fffbff", "on-tertiary-fixed": "#321200", "on-tertiary-fixed-variant": "#763400", "outline": "#717785",
            "outline-variant": "#c1c6d5", "primary": "#005ab4", "primary-container": "#0873df", "primary-fixed": "#d6e3ff",
            "primary-fixed-dim": "#aac7ff", "secondary": "#465f89", "secondary-container": "#b7cfff", "secondary-fixed": "#d6e3ff",
            "secondary-fixed-dim": "#afc7f7", "surface": "#f9f9ff", "surface-bright": "#f9f9ff", "surface-container": "#ecedf7",
            "surface-container-high": "#e6e8f1", "surface-container-highest": "#e0e2ec", "surface-container-low": "#f2f3fd", "surface-container-lowest": "#ffffff",
            "surface-dim": "#d8dae3", "surface-tint": "#005db8", "surface-variant": "#e0e2ec", "tertiary": "#964400",
            "tertiary-container": "#bd5700", "tertiary-fixed": "#ffdbc9", "tertiary-fixed-dim": "#ffb68c",
            "primary-dim": "#00458d", "secondary-dim": "#2e4770", "tertiary-dim": "#763400", "error-dim": "#93000a",
            "slate-950": "#f9f9ff", "slate-400": "#414753", "slate-500": "#717785", "slate-200": "#181c22"
          },
          fontFamily: { "body": ["Inter"], "headline": ["Inter"] },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="selection:bg-primary/30 antialiased">
  <div class="flex items-center justify-center min-h-[100dvh] p-4 text-left relative bg-background">

    <div
      class="bg-surface-container-lowest w-full max-w-md rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden z-10 relative">
      <!-- Card header -->
      <div class="bg-[#1864c0] h-36 relative flex items-center justify-center">
        <div class="relative z-10 w-20 h-20 bg-white rounded-2xl shadow-md flex items-center justify-center">
          <div class="w-12 h-12">
            <svg viewBox="0 0 100 100" class="w-full h-full">
              <polygon points="50,15 85,35 50,55 15,35" fill="#fbbd5c" />
              <polygon points="15,35 50,55 50,90 15,70" fill="#f26d5b" />
              <polygon points="85,35 50,55 50,90 85,70" fill="#9c3f91" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Card body -->
      <div class="p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-on-surface mb-1 tracking-tight">Reset Password</h1>
          <p class="text-sm text-on-surface-variant">Enter your new password below.</p>
        </div>

        <div id="reset-form" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-on-surface mb-2">New Password</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-outline text-xl">lock</span>
              <input type="password" id="rp-password"
                class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm shadow-sm tracking-widest"
                placeholder="••••••••" />
              <button type="button"
                class="material-symbols-outlined absolute right-3 text-outline hover:text-on-surface transition-colors cursor-pointer text-xl"
                tabindex="-1"
                onclick="toggleVisibility('rp-password', this)">visibility</button>
            </div>
            <p class="text-xs text-on-surface-variant mt-1">Min 8 chars, uppercase, lowercase, and a number.</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-on-surface mb-2">Confirm Password</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-outline text-xl">lock</span>
              <input type="password" id="rp-confirm"
                class="w-full pl-10 pr-10 py-3 rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm shadow-sm tracking-widest"
                placeholder="••••••••"
                onkeydown="if(event.key==='Enter') handleReset()" />
              <button type="button"
                class="material-symbols-outlined absolute right-3 text-outline hover:text-on-surface transition-colors cursor-pointer text-xl"
                tabindex="-1"
                onclick="toggleVisibility('rp-confirm', this)">visibility</button>
            </div>
          </div>

          <button
            class="w-full bg-primary hover:bg-primary-dim text-on-primary py-3 rounded-lg font-bold transition-all cursor-pointer flex justify-center items-center gap-2 text-base shadow-sm"
            onclick="handleReset()">
            Set New Password
            <span class="material-symbols-outlined text-xl">check_circle</span>
          </button>

          <div id="rp-msg" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
        </div>

        <!-- Invalid/expired token state -->
        <div id="invalid-token" class="hidden text-center space-y-4">
          <span class="material-symbols-outlined text-5xl text-error">error</span>
          <p class="text-on-surface font-semibold">Invalid or expired reset link.</p>
          <p class="text-sm text-on-surface-variant">Reset links expire after 1 hour.</p>
          <a href="forgot-password.html"
            class="inline-block mt-2 bg-primary hover:bg-primary-dim text-on-primary py-2 px-6 rounded-lg font-bold text-sm">
            Request New Link
          </a>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      const PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

      function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const show  = input.type === 'password';
        input.type  = show ? 'text' : 'password';
        btn.textContent = show ? 'visibility_off' : 'visibility';
      }

      // Extract token from URL ?token=...
      const urlToken = new URLSearchParams(window.location.search).get('token') || '';
      if (!urlToken) {
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('invalid-token').classList.remove('hidden');
      }

      async function handleReset() {
        const pwd     = document.getElementById('rp-password').value;
        const confirm = document.getElementById('rp-confirm').value;
        const msg     = document.getElementById('rp-msg');
        msg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium";

        if (!pwd || !confirm) {
          msg.classList.add('bg-error-container/20', 'text-error', 'block');
          msg.textContent = 'Both fields are required.';
          return;
        }
        if (pwd !== confirm) {
          msg.classList.add('bg-error-container/20', 'text-error', 'block');
          msg.textContent = 'Passwords do not match.';
          return;
        }
        if (!PASSWORD_REGEX.test(pwd)) {
          msg.classList.add('bg-error-container/20', 'text-error', 'block');
          msg.textContent = 'Password must be 8+ chars with uppercase, lowercase, and a number.';
          return;
        }

        msg.classList.add('bg-surface-variant', 'text-on-surface', 'block');
        msg.textContent = 'Resetting password...';

        try {
          const res  = await fetch(`${CONFIG.AUTH_ENDPOINT}/reset-password`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ token: urlToken, newPassword: pwd })
          });
          const data = await res.json();

          if (res.status === 200) {
            msg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium block bg-tertiary-container/30 text-tertiary";
            msg.textContent = 'Password reset! Redirecting to login...';
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
          } else if (res.status === 400) {
            // Invalid or expired token
            document.getElementById('reset-form').classList.add('hidden');
            document.getElementById('invalid-token').classList.remove('hidden');
          } else {
            msg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium block bg-error-container/20 text-error";
            msg.textContent = data.message || 'Reset failed. Please try again.';
          }
        } catch (_) {
          msg.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium block bg-error-container/20 text-error";
          msg.textContent = 'Network error. Please try again.';
        }
      }
    </script>
  </div>
</body>

</html>
