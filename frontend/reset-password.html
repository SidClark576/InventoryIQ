<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>InventoryIQ | Reset Password</title>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#005ab4' } } }
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="antialiased text-[#eef2fb]">
  <main class="min-h-[100dvh] flex items-center justify-center px-6 py-10 bg-[#0a0e1a] relative overflow-hidden">
    <div class="pointer-events-none absolute -top-40 -left-32 w-[520px] h-[520px] rounded-full"
      style="background:radial-gradient(circle,rgba(0,90,180,0.22),transparent 65%)"></div>
    <div class="pointer-events-none absolute -bottom-44 -right-32 w-[520px] h-[520px] rounded-full"
      style="background:radial-gradient(circle,rgba(226,182,92,0.10),transparent 65%)"></div>

    <div class="w-full max-w-[400px] relative z-10">
      <div class="flex items-center gap-3.5 mb-7 justify-center">
        <div
          class="w-10 h-10 bg-[#0a0e1a] rounded-xl border border-[#243352] flex items-center justify-center p-1.5 shadow-[0_0_20px_-6px_rgba(226,182,92,0.5)]">
          <svg viewBox="0 0 100 100" class="w-full h-full">
            <polygon points="50,15 85,35 50,55 15,35" fill="#fbbd5c" />
            <polygon points="15,35 50,55 50,90 15,70" fill="#f26d5b" />
            <polygon points="85,35 50,55 50,90 85,70" fill="#9c3f91" />
          </svg>
        </div>
        <span class="text-[16px] font-black text-[#eef2fb] tracking-tight">InventoryIQ</span>
      </div>

      <div class="surface-card p-7 lg:p-9">
        <div id="reset-form">
          <div class="mb-7">
            <h1 class="text-2xl font-black text-[#eef2fb] tracking-tight">Reset password</h1>
            <p class="text-sm text-[#9fb0d0] mt-1.5">Enter your new password below.</p>
          </div>

          <div class="space-y-5">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">New
                Password</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">lock</span>
                <input type="password" id="rp-password"
                  class="w-full pl-11 pr-11 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96] tracking-widest"
                  placeholder="••••••••" />
                <button type="button"
                  class="material-symbols-outlined absolute right-3 text-[#5d6f96] hover:text-[#eef2fb] transition-colors cursor-pointer text-xl bg-transparent border-0 p-0"
                  tabindex="-1" onclick="toggleVisibility('rp-password', this)">visibility</button>
              </div>
              <p class="text-[11px] text-[#5d6f96] mt-1.5">Min 8 chars, uppercase, lowercase, and a number.</p>
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Confirm
                Password</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">lock</span>
                <input type="password" id="rp-confirm"
                  class="w-full pl-11 pr-11 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96] tracking-widest"
                  placeholder="••••••••" onkeydown="if(event.key==='Enter') handleReset()" />
                <button type="button"
                  class="material-symbols-outlined absolute right-3 text-[#5d6f96] hover:text-[#eef2fb] transition-colors cursor-pointer text-xl bg-transparent border-0 p-0"
                  tabindex="-1" onclick="toggleVisibility('rp-confirm', this)">visibility</button>
              </div>
            </div>

            <button
              class="btn-press w-full bg-[#005ab4] hover:bg-[#0a6ed4] text-white py-3 rounded-xl font-bold flex justify-center items-center gap-2 text-[15px] shadow-[0_8px_24px_-10px_rgba(0,90,180,0.9)]"
              onclick="handleReset()">
              Set New Password
              <span class="material-symbols-outlined text-xl">check_circle</span>
            </button>

            <div id="rp-msg" class="hidden mt-2 p-3 rounded-xl text-center text-sm font-semibold"></div>
          </div>
        </div>

        <!-- Invalid/expired token state -->
        <div id="invalid-token" class="hidden text-center space-y-4 py-4">
          <span class="material-symbols-outlined text-5xl text-[#f87171]">error</span>
          <p class="text-[#eef2fb] font-bold">Invalid or expired reset link.</p>
          <p class="text-sm text-[#9fb0d0]">Reset links expire after 1 hour.</p>
          <a href="forgot-password.html"
            class="btn-press inline-block mt-2 bg-[#005ab4] hover:bg-[#0a6ed4] text-white py-2.5 px-6 rounded-xl font-bold text-sm">
            Request New Link
          </a>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      const PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

      function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'visibility_off' : 'visibility';
      }

      function setMsg(kind, text) {
        const el = document.getElementById('rp-msg');
        const base = "mt-2 p-3 rounded-xl text-center text-sm font-semibold block border ";
        const styles = {
          err: "bg-[#f87171]/10 text-[#f87171] border-[#f87171]/25",
          info: "bg-[#1d2942] text-[#9fb0d0] border-[#243352]",
          ok: "bg-[#34d399]/10 text-[#34d399] border-[#34d399]/25"
        };
        el.className = base + styles[kind];
        el.textContent = text;
      }

      // Extract token from URL ?token=...
      const urlToken = new URLSearchParams(window.location.search).get('token') || '';
      if (!urlToken) {
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('invalid-token').classList.remove('hidden');
      }

      async function handleReset() {
        const pwd = document.getElementById('rp-password').value;
        const confirm = document.getElementById('rp-confirm').value;
        if (!pwd || !confirm) { setMsg('err', 'Both fields are required.'); return; }
        if (pwd !== confirm) { setMsg('err', 'Passwords do not match.'); return; }
        if (!PASSWORD_REGEX.test(pwd)) {
          setMsg('err', 'Password must be 8+ chars with uppercase, lowercase, and a number.');
          return;
        }
        setMsg('info', 'Resetting password...');
        try {
          const res = await fetch(`${CONFIG.AUTH_ENDPOINT}/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: urlToken, newPassword: pwd })
          });
          const data = await res.json();

          if (res.status === 200) {
            setMsg('ok', 'Password reset! Redirecting to login...');
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
          } else if (res.status === 400) {
            document.getElementById('reset-form').classList.add('hidden');
            document.getElementById('invalid-token').classList.remove('hidden');
          } else {
            setMsg('err', data.message || 'Reset failed. Please try again.');
          }
        } catch (_) {
          setMsg('err', 'Network error. Please try again.');
        }
      }
    </script>
  </main>
</body>

</html>
