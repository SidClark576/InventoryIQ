<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>InventoryIQ | Login</title>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#005ab4' } } }
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="antialiased text-[#eef2fb]">
  <main class="min-h-[100dvh] grid lg:grid-cols-[1.05fr_1fr]">

    <!-- Auth panel -->
    <section class="flex items-center justify-center px-6 py-10 lg:px-10 bg-[#0a0e1a]">
      <div class="w-full max-w-[400px]">
        <div class="surface-card p-7 lg:p-9">
          <div class="mb-7">
            <h1 id="auth-title" class="text-2xl font-black text-[#eef2fb] tracking-tight">Welcome back</h1>
            <p id="auth-subtitle" class="text-sm text-[#9fb0d0] mt-1.5">Manage your inventory with precision</p>
          </div>

          <!-- Login form -->
          <div id="login-form" class="auth-form active space-y-5">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Email
                address</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">mail</span>
                <input type="email" id="login-email"
                  class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96]"
                  placeholder="name@company.com" />
              </div>
            </div>

            <div>
              <label
                class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Password</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">lock</span>
                <input type="password" id="login-password"
                  class="w-full pl-11 pr-11 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96] tracking-widest"
                  placeholder="••••••••" onkeydown="if(event.key==='Enter') handleLogin()" />
                <button type="button"
                  class="material-symbols-outlined absolute right-3 text-[#5d6f96] hover:text-[#eef2fb] transition-colors cursor-pointer text-xl bg-transparent border-0 p-0"
                  tabindex="-1" onclick="toggleVisibility('login-password', this)">visibility</button>
              </div>
            </div>

            <div class="flex items-center justify-between pt-0.5">
              <label class="flex items-center gap-2 text-sm text-[#9fb0d0] cursor-pointer">
                <input type="checkbox" id="remember" class="w-4 h-4 rounded" />
                Remember device
              </label>
              <a href="forgot-password.html" class="text-sm text-[#3b8df0] font-semibold hover:underline">Forgot
                password?</a>
            </div>

            <button
              class="btn-press w-full bg-[#005ab4] hover:bg-[#0a6ed4] text-white py-3 rounded-xl font-bold flex justify-center items-center gap-2 text-[15px] shadow-[0_8px_24px_-10px_rgba(0,90,180,0.9)]"
              onclick="handleLogin()">
              Login
              <span class="material-symbols-outlined text-xl">arrow_forward</span>
            </button>

            <div id="login-msg" class="hidden mt-2 p-3 rounded-xl text-center text-sm font-semibold"></div>

            <div class="pt-5 border-t border-[#243352] text-center text-sm text-[#9fb0d0]">
              Don't have an account?
              <span class="text-[#3b8df0] font-bold cursor-pointer hover:underline"
                onclick="switchAuthTab('register')">Sign Up</span>
            </div>
          </div>

          <!-- Register form -->
          <div id="register-form" class="auth-form space-y-5">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Email
                address</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">mail</span>
                <input type="email" id="reg-email"
                  class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96]"
                  placeholder="name@company.com" />
              </div>
            </div>
            <div>
              <label
                class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Password</label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3.5 text-[#5d6f96] text-xl pointer-events-none">lock</span>
                <input type="password" id="reg-password"
                  class="w-full pl-11 pr-11 py-3 rounded-xl bg-[#1d2942] border border-[#243352] text-sm text-[#eef2fb] placeholder:text-[#5d6f96]"
                  placeholder="Create password" />
                <button type="button"
                  class="material-symbols-outlined absolute right-3 text-[#5d6f96] hover:text-[#eef2fb] transition-colors cursor-pointer text-xl bg-transparent border-0 p-0"
                  tabindex="-1" onclick="toggleVisibility('reg-password', this)">visibility</button>
              </div>
              <p class="text-[11px] text-[#5d6f96] mt-1.5">8+ chars with uppercase, lowercase, and a number.</p>
            </div>
            <button
              class="btn-press w-full mt-1 bg-[#005ab4] hover:bg-[#0a6ed4] text-white py-3 rounded-xl font-bold flex justify-center items-center gap-2 text-[15px] shadow-[0_8px_24px_-10px_rgba(0,90,180,0.9)]"
              onclick="handleRegister()">
              Create Account
              <span class="material-symbols-outlined text-xl">person_add</span>
            </button>
            <div id="reg-msg" class="hidden mt-2 p-3 rounded-xl text-center text-sm font-semibold"></div>

            <div class="pt-5 border-t border-[#243352] text-center text-sm text-[#9fb0d0]">
              Already have an account?
              <span class="text-[#3b8df0] font-bold cursor-pointer hover:underline" onclick="switchAuthTab('login')">Log
                In</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'visibility_off' : 'visibility';
    }

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('login-form').classList.toggle('active', isLogin);
      document.getElementById('register-form').classList.toggle('active', !isLogin);
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      if (isLogin) {
        title.textContent = 'Welcome back';
        subtitle.textContent = 'Manage your inventory with precision';
      } else {
        title.textContent = 'Create account';
        subtitle.textContent = 'Start managing your inventory today';
      }
    }

    function setMsg(el, kind, text) {
      const base = "mt-2 p-3 rounded-xl text-center text-sm font-semibold block border ";
      const styles = {
        err: "bg-[#f87171]/10 text-[#f87171] border-[#f87171]/25",
        info: "bg-[#1d2942] text-[#9fb0d0] border-[#243352]",
        ok: "bg-[#34d399]/10 text-[#34d399] border-[#34d399]/25"
      };
      el.className = base + styles[kind];
      el.textContent = text;
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pwd = document.getElementById('login-password').value;
      const msg = document.getElementById('login-msg');
      if (!email || !pwd) { setMsg(msg, 'err', 'Enter email & password.'); return; }
      setMsg(msg, 'info', 'Logging in...');
      const { status, data } = await authLogin(email, pwd);
      if (status === 200) {
        sessionStorage.setItem('sessionToken', data.token);
        sessionStorage.setItem('userEmail', data.email);
        window.location.href = 'dashboard.html';
      } else {
        setMsg(msg, 'err', data.message || 'Login failed.');
      }
    }

    async function handleRegister() {
      const email = document.getElementById('reg-email').value.trim();
      const pwd = document.getElementById('reg-password').value;
      const msg = document.getElementById('reg-msg');
      if (!email || !pwd) { setMsg(msg, 'err', 'Enter email & password.'); return; }
      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pwd)) {
        setMsg(msg, 'err', 'Password must be 8+ chars with uppercase, lowercase, and a number.');
        return;
      }
      setMsg(msg, 'info', 'Creating account...');
      const { status, data } = await authRegister(email, pwd);
      if (status === 200) {
        setMsg(msg, 'ok', 'Account created!');
        setTimeout(() => switchAuthTab('login'), 1500);
      } else {
        setMsg(msg, 'err', data.message || 'Registration failed.');
      }
    }

    window.onload = function () {
      if (sessionStorage.getItem('userEmail')) {
        window.location.href = 'dashboard.html';
        return;
      }
      const params = new URLSearchParams(window.location.search);
      if (params.get('expired') === '1') {
        setMsg(document.getElementById('login-msg'), 'err', 'Session expired. Please log in again.');
      }
    };
  </script>
</body>

</html>
