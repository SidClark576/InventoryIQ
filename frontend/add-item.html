<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>InventoryIQ | Add Asset</title>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#005ab4' } } }
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="antialiased text-[#eef2fb]">
  <div class="h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[260px] bg-[#11182b] border-r border-[#243352] flex flex-col justify-between shrink-0 fixed inset-y-0 left-0 z-40 -translate-x-full transition-transform duration-300 ease-out lg:static lg:translate-x-0">
      <div>
        <div class="h-20 flex items-center px-6 border-b border-[#243352]">
          <div class="flex items-center gap-3.5">
            <div
              class="w-10 h-10 bg-[#0a0e1a] rounded-xl border border-[#243352] flex items-center justify-center p-1.5 shadow-[0_0_20px_-6px_rgba(226,182,92,0.4)]">
              <svg viewBox="0 0 100 100" class="w-full h-full">
                <polygon points="50,15 85,35 50,55 15,35" fill="#fbbd5c" />
                <polygon points="15,35 50,55 50,90 15,70" fill="#f26d5b" />
                <polygon points="85,35 50,55 50,90 85,70" fill="#9c3f91" />
              </svg>
            </div>
            <div class="flex flex-col">
              <span class="text-[16px] font-black text-[#eef2fb] leading-tight tracking-tight">InventoryIQ</span>
              <span class="text-[10px] font-bold text-[#5d6f96] tracking-[0.12em] uppercase">Ops Terminal</span>
            </div>
          </div>
        </div>

        <nav class="p-3 space-y-1 mt-3">
          <a href="dashboard.html" data-page="dashboard"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">grid_view</span> Dashboard
          </a>
          <a href="inventory.html" data-page="inventory"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">inventory_2</span> Inventory
          </a>
          <a href="suppliers.html" data-page="suppliers"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">local_shipping</span> Suppliers
          </a>

          <a href="insights.html" data-page="insights"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">bar_chart</span> Insights
          </a>
          <a href="transactions.html" data-page="transactions"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">receipt_long</span> Transactions
          </a>
          <a href="forecast.html" data-page="forecast"
            class="nav-link nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm">
            <span class="material-symbols-outlined text-xl">trending_up</span> Forecast
          </a>
        </nav>
      </div>

      <div class="p-3 border-t border-[#243352] pt-4">
        <button
          class="btn-press flex items-center gap-3 w-full px-4 py-3 text-[#f87171] hover:bg-[#f87171]/10 rounded-xl font-semibold text-sm cursor-pointer"
          onclick="handleLogout()">
          <span class="material-symbols-outlined text-xl">logout</span> Logout
        </button>
      </div>
    </aside>

    <!-- Mobile sidebar backdrop -->
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/60 z-30 lg:hidden" onclick="closeSidebar()"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
      <header
        class="h-20 bg-[#11182b]/80 backdrop-blur border-b border-[#243352] flex items-center justify-between px-4 sm:px-6 lg:px-10 shrink-0">
        <button type="button" onclick="toggleSidebar()" aria-label="Toggle menu"
          class="lg:hidden w-10 h-10 -ml-1 flex items-center justify-center rounded-lg text-[#9fb0d0] hover:text-[#eef2fb] hover:bg-white/5 cursor-pointer">
          <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
        <div class="ml-auto flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-[#34d399]"></span>
          <span class="text-sm font-semibold text-[#9fb0d0]" id="nav-email"></span>
        </div>
      </header>

      <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-10 space-y-8">
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-[#5d6f96] mb-2">Asset Management</p>
          <h1 id="form-title" class="text-3xl font-black text-[#eef2fb] tracking-tight">Add New Item</h1>
          <div class="title-rule"></div>
        </div>

        <div class="surface-card p-6 sm:p-8 lg:p-10 max-w-3xl">
          <input type="hidden" id="edit-id" />
          <input type="hidden" id="edit-version" />
          <input type="hidden" id="f-barcode" />
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
            <div class="col-span-full">
              <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                <label class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96]">Product Name *</label>
                <button type="button" onclick="openScanModal()"
                  class="flex items-center gap-1.5 text-xs font-semibold text-[#3b8df0] hover:text-[#eef2fb] transition-colors cursor-pointer">
                  <span class="material-symbols-outlined text-base">qr_code_scanner</span> Scan Barcode
                </button>
              </div>
              <input type="text" id="f-name"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96]"
                placeholder="e.g. Pro Studio Display" />
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96] mb-2">Category</label>
              <input type="text" id="f-category" list="category-suggestions"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96]"
                placeholder="e.g. Electronics" autocomplete="off" />
              <datalist id="category-suggestions"></datalist>
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96] mb-2">Price ($)</label>
              <input type="number" id="f-price"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96] tnum"
                placeholder="0.00" step="0.01" min="0" />
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96] mb-2">Quantity</label>
              <input type="number" id="f-quantity"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96] tnum"
                placeholder="0" min="0" />
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96] mb-2">Low Stock
                Threshold</label>
              <input type="number" id="f-threshold"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96] tnum"
                placeholder="10" min="0" />
            </div>
            <div class="col-span-full">
              <label
                class="block text-[11px] font-bold uppercase tracking-widest text-[#5d6f96] mb-2">Description</label>
              <textarea id="f-description"
                class="w-full rounded-xl px-5 py-4 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all font-medium text-[#eef2fb] placeholder:text-[#5d6f96] min-h-[100px]"
                placeholder="Optional details..."></textarea>
            </div>
          </div>
          <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-10 pt-8 border-t border-[#243352]">
            <button
              class="btn-press bg-[#005ab4] hover:bg-[#0a6ed4] text-white px-10 py-4 rounded-xl font-bold shadow-[0_8px_24px_-10px_rgba(0,90,180,0.9)] transition-all cursor-pointer"
              onclick="handleSaveItem()">Save Asset</button>
            <button
              class="btn-press px-10 py-4 rounded-xl font-bold text-[#9fb0d0] bg-[#161f36] border border-[#243352] hover:text-[#eef2fb] hover:border-[#33476f] transition-all cursor-pointer"
              onclick="window.location.href='dashboard.html'">Cancel</button>
          </div>
          <div id="form-msg" class="mt-4 text-sm font-semibold"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Barcode scan modal -->
  <div id="scan-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-[#161f36] border border-[#243352] rounded-2xl shadow-xl w-[90vw] max-w-sm max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-[#243352]">
        <h2 class="font-bold text-[#eef2fb]">Scan Barcode</h2>
        <button onclick="closeScanModal()" class="text-[#5d6f96] hover:text-[#eef2fb] transition cursor-pointer">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="scan-camera-view" class="relative bg-black" style="height:260px">
        <div id="scan-quagga-target" style="width:100%;height:100%"></div>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="border-2 border-white/70 rounded-lg w-56 h-28"></div>
        </div>
      </div>
      <div id="scan-fallback" class="hidden px-6 py-4 space-y-3">
        <p class="text-xs text-[#5d6f96]">Camera unavailable. Enter barcode manually or upload an image.</p>
        <input type="text" id="scan-manual-input" placeholder="e.g. 737628064502"
          class="w-full rounded-xl px-4 py-3 bg-[#1d2942] border border-[#243352] focus:border-[#3b8df0] focus:outline-none focus:ring-2 focus:ring-[#3b8df0]/30 transition-all text-sm font-medium text-[#eef2fb] placeholder:text-[#5d6f96]" />
        <button onclick="lookupManual()"
          class="btn-press w-full bg-[#005ab4] hover:bg-[#0a6ed4] text-white px-4 py-3 rounded-xl font-bold text-sm transition-all cursor-pointer">Lookup</button>
        <label class="block text-xs text-[#5d6f96] text-center cursor-pointer">
          or upload barcode image
          <input type="file" accept="image/*" capture="environment" id="scan-file-input" class="hidden" onchange="lookupFromImage(this)" />
          <span class="block mt-1 text-[#3b8df0] font-semibold hover:underline">Choose image</span>
        </label>
      </div>
      <div id="scan-status" class="px-6 py-3 text-sm text-center text-[#9fb0d0] min-h-[2.5rem]"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script>
    requireAuth();
    initNav('');

    (async function() {
      try {
        const cats = await getCategories();
        const dl = document.getElementById('category-suggestions');
        if (dl) dl.innerHTML = cats.map(c => `<option value="${c}"></option>`).join('');
      } catch { /* silently fail — text input still works without suggestions */ }
    })();

    function clearForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('form-title').textContent = 'Add New Item';
      ['f-name', 'f-category', 'f-price', 'f-quantity', 'f-threshold', 'f-description'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('form-msg').textContent = '';
    }

    // Pre-populate form if editing
    const raw = sessionStorage.getItem('iq_editItem');
    if (raw) {
      sessionStorage.removeItem('iq_editItem');
      const it = JSON.parse(raw);
      document.getElementById('edit-id').value = it.itemID;
      document.getElementById('edit-version').value = it.version || 1;
      document.getElementById('form-title').textContent = 'Edit Item';
      document.getElementById('f-name').value = it.name || '';
      document.getElementById('f-category').value = it.category || '';
      document.getElementById('f-price').value = it.price || '';
      document.getElementById('f-quantity').value = it.quantity ?? '';
      document.getElementById('f-threshold').value = it.lowStockThreshold ?? '';
      document.getElementById('f-description').value = it.description || '';
      document.getElementById('f-barcode').value = it.barcode || '';
    } else {
      clearForm();
    }

    async function handleSaveItem() {
      const id = document.getElementById('edit-id').value;
      const version = document.getElementById('edit-version').value || null;
      const m = document.getElementById('form-msg');
      const p = {
        name: document.getElementById('f-name').value.trim(),
        category: document.getElementById('f-category').value.trim(),
        price: parseFloat(document.getElementById('f-price').value) || 0,
        quantity: parseInt(document.getElementById('f-quantity').value) || 0,
        lowStockThreshold: parseInt(document.getElementById('f-threshold').value) || 10,
        description: document.getElementById('f-description').value.trim(),
        barcode: document.getElementById('f-barcode').value,
        userID: sessionStorage.getItem('userEmail') || ''
      };
      if (!p.name) { m.style.color = '#f87171'; m.textContent = 'Name required.'; return; }
      m.style.color = '#3b8df0'; m.textContent = 'Saving...';
      try {
        const r = id ? await updateItem(id, p, version) : await addItem(p);
        m.style.color = '#34d399'; m.textContent = '✅ ' + (r.message || 'Saved!');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
      } catch (e) {
        m.style.color = '#f87171'; m.textContent = '❌ ' + e.message;
      }
    }

    // ── Barcode scan logic ────────────────────────────────────────
    let _quaggaLoaded = false;
    let _scanActive = false;

    function openScanModal() {
      document.getElementById('scan-modal').classList.remove('hidden');
      document.getElementById('scan-status').textContent = 'Starting camera...';
      document.getElementById('scan-fallback').classList.add('hidden');
      document.getElementById('scan-camera-view').classList.remove('hidden');
      _loadQuagga().then(startCamera).catch(() => showFallback());
    }

    function closeScanModal() {
      stopCamera();
      document.getElementById('scan-modal').classList.add('hidden');
      document.getElementById('scan-status').textContent = '';
    }

    function showFallback() {
      stopCamera();
      document.getElementById('scan-camera-view').classList.add('hidden');
      document.getElementById('scan-fallback').classList.remove('hidden');
      document.getElementById('scan-status').textContent = '';
    }

    function _loadQuagga() {
      if (_quaggaLoaded) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js';
        s.onload = () => { _quaggaLoaded = true; resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    function startCamera() {
      Quagga.init({
        inputStream: {
          type: 'LiveStream',
          target: document.getElementById('scan-quagga-target'),
          constraints: { facingMode: 'environment' }
        },
        decoder: { readers: ['ean_reader', 'upc_reader', 'code_128_reader'] },
        locate: true
      }, function(err) {
        if (err) { showFallback(); return; }
        Quagga.start();
        _scanActive = true;
        document.getElementById('scan-status').textContent = 'Point camera at barcode...';
        Quagga.onDetected(onBarcodeDetected);
      });
    }

    function stopCamera() {
      if (_scanActive) {
        try { Quagga.stop(); } catch (_) {}
        _scanActive = false;
      }
    }

    async function onBarcodeDetected(result) {
      const code = result && result.codeResult && result.codeResult.code;
      if (!code) return;
      stopCamera();
      document.getElementById('scan-status').textContent = `Found: ${code} — looking up...`;
      await applyBarcodeLookup(code);
    }

    async function lookupManual() {
      const code = document.getElementById('scan-manual-input').value.trim();
      if (!code) return;
      document.getElementById('scan-status').textContent = `Looking up ${code}...`;
      await applyBarcodeLookup(code);
    }

    function lookupFromImage(input) {
      const file = input.files[0];
      if (!file || !_quaggaLoaded) return;
      document.getElementById('scan-status').textContent = 'Scanning image...';
      Quagga.decodeSingle({
        decoder: { readers: ['ean_reader', 'upc_reader', 'code_128_reader'] },
        locate: true,
        src: URL.createObjectURL(file)
      }, async function(result) {
        const code = result && result.codeResult && result.codeResult.code;
        if (!code) { document.getElementById('scan-status').textContent = 'No barcode found in image.'; return; }
        document.getElementById('scan-status').textContent = `Found: ${code} — looking up...`;
        await applyBarcodeLookup(code);
      });
    }

    async function applyBarcodeLookup(code) {
      try {
        const product = await lookupBarcode(code);
        if (!product) {
          document.getElementById('scan-status').textContent = `No product found for ${code}.`;
          return;
        }
        document.getElementById('f-barcode').value = code;
        if (product.name) document.getElementById('f-name').value = product.name;
        if (product.category) document.getElementById('f-category').value = product.category;
        document.getElementById('scan-status').textContent = `✅ Filled: ${product.name}`;
        setTimeout(closeScanModal, 900);
      } catch (e) {
        document.getElementById('scan-status').textContent = `Error: ${e.message}`;
      }
    }
  </script>
</body>

</html>
